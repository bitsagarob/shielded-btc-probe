[package]
name = "shielded-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ark-bls12-381 = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "merkle_tree", "r1cs"] }
ark-ec = "0.5"
ark-ed-on-bls12-381 = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
bitcoin = { version = "0.32", features = ["serde"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.13.0"
log = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
