[package]
name = "shielded-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Probe implementation of the Shielded Bitcoin transfer layer on Bitcoin and the Bitsaga Signet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitsagarob/shielded-probe"
readme = "README.md"
keywords = ["bitcoin", "zero-knowledge", "groth16", "privacy", "signet"]
categories = ["cryptography"]
publish = false

[profile.release]
overflow-checks = true

[dependencies]
anyhow = "1.0.104"
ark-bls12-381 = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "merkle_tree", "r1cs"] }
ark-ec = "0.5"
ark-ed-on-bls12-381 = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
bitcoin = { version = "0.32", features = ["serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
fs2 = "0.4"
hex = { version = "0.4.3", features = ["serde"] }
hkdf = "0.12"
log = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[features]
test-util = []

[dev-dependencies]
proptest = "1.11"
shielded-probe = { path = ".", features = ["test-util"] }

# Dependencies optimised in debug so `cargo test` without --release stays usable.
[profile.dev.package."*"]
opt-level = 3
